name: Build Nusa APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: |
          ls -la
          unzip -q ./*.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle -p NusaAndroid :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Nusa-debug-apk
          path: NusaAndroid/app/build/outputs/apk/debug/app-debug.apk
